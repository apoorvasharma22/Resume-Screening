name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: shortlist, POSTGRES_PASSWORD: shortlist, POSTGRES_DB: shortlist_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shortlist" --health-interval 5s --health-timeout 3s --health-retries 10
    strategy:
      matrix:
        db: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg2://shortlist:shortlist@localhost:5432/shortlist_test' || '' }}
        run: python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shortlist .
